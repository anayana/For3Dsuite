<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Splat — 360Pano3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
                 font-family: system-ui, -apple-system, sans-serif; }
    #topbar { position: absolute; top: 14px; left: 14px; z-index: 30;
              display: flex; gap: 10px; align-items: center; }
    #topbar a, #title { color: #eee; background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      padding: 8px 14px; font-size: 13px; text-decoration: none; }
    #title { font-weight: 600; }
    #note { position: absolute; bottom: 16px; left: 14px; z-index: 30; max-width: 420px;
      color: #cbd5e1; background: rgba(13,17,23,.82); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.14); border-left: 3px solid #d29922;
      border-radius: 10px; padding: 9px 13px; font-size: 12px; line-height: 1.5; }
    #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 40;
      color: #ffb4b4; background: #000; text-align: center; padding: 24px; font-size: 14px; }
    #help { position: absolute; bottom: 16px; right: 14px; z-index: 30; color: #cbd5e1;
      background: rgba(13,17,23,.72); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 8px 12px;
      font-size: 11.5px; line-height: 1.6; }
    #help b { color: #eee; }
    #modeBar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: flex; background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px; overflow: hidden; }
    #modeBar button { background: none; border: none; color: #cfcfcf; cursor: pointer;
      padding: 7px 15px; font-size: 12.5px; }
    #modeBar button.active { background: rgba(126,231,135,.22); color: #d8ffdb; }
    /* ---- Marker (3D-verankerte Info-Punkte) + Popup-Karte ---- */
    #markers { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
    .pin { position: absolute; transform: translate(-50%, -50%); pointer-events: auto;
      cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid;
      place-items: center; font-size: 16px; color: #fff; padding: 0;
      background: radial-gradient(circle at 32% 28%, #e6b23c, #a8741a);
      border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 0 4px rgba(210,150,34,.22);
      transition: transform .12s ease, box-shadow .12s ease; }
    .pin:hover { transform: translate(-50%, -50%) scale(1.16);
      box-shadow: 0 3px 15px rgba(0,0,0,.6), 0 0 0 7px rgba(210,150,34,.34); z-index: 2; }
    .pin .lbl { position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 11.5px; color: #f0f0f0; background: rgba(0,0,0,.7);
      padding: 3px 9px; border-radius: 7px; opacity: 0; transition: opacity .12s;
      pointer-events: none; }
    .pin:hover .lbl { opacity: 1; }
    #pop { position: absolute; inset: 0; z-index: 50; display: none; place-items: center;
      background: rgba(0,0,0,.55); backdrop-filter: blur(3px); padding: 16px; }
    #pop.open { display: grid; }
    #card { width: min(440px, 94vw); max-height: 88vh; overflow: auto; background: #0d1117;
      border: 1px solid rgba(255,255,255,.14); border-radius: 14px; color: #e6edf3;
      box-shadow: 0 22px 64px rgba(0,0,0,.62); }
    #card img, #card video { width: 100%; display: block; background: #000;
      max-height: 52vh; object-fit: contain; }
    #card .body { padding: 15px 18px 18px; position: relative; }
    #card h2 { margin: 0 26px 9px 0; font-size: 19px; line-height: 1.25; }
    #card p { margin: 0; font-size: 14px; line-height: 1.62; color: #cbd5e1; }
    #card .cap { margin-top: 12px; font-size: 12px; font-style: italic; color: #9aa7b4; }
    #card .cred { margin-top: 6px; font-size: 11px; color: #6b7684; }
    #card .x { position: absolute; top: 12px; right: 14px; cursor: pointer; color: #9aa7b4;
      font-size: 22px; line-height: 1; background: none; border: none; }
    #card .x:hover { color: #e6edf3; }
  </style>
</head>
<body>
  <div id="topbar">
    <a href="index.html">← Szenen</a>
    <span id="title"></span>
  </div>
  <div id="modeBar">
    <button id="m-walk" class="active">Begehen</button>
    <button id="m-orbit">Umkreisen</button>
  </div>
  <div id="note" hidden></div>
  <div id="help">
    <b>Begehen:</b> Maus ziehen = umschauen · <b>W A S D</b> = gehen ·
    <b>Q / E</b> = tiefer / höher · <b>Shift</b> = schneller
  </div>
  <div id="err"></div>
  <div id="markers"></div>
  <div id="pop"><div id="card"></div></div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import * as GaussianSplats3D from
      'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

    const sid = new URLSearchParams(location.search).get('id');
    const fail = (m) => { const e = document.getElementById('err');
      e.textContent = m; e.style.display = 'grid'; };

    async function init() {
      if (!sid) { location.href = 'index.html'; return; }
      const r = await fetch('data/scene-' + encodeURIComponent(sid) + '.json');
      if (!r.ok) return fail('Szene nicht gefunden');
      const scene = await r.json();
      document.title = (scene.title || sid) + ' — 360Pano3D';
      document.getElementById('title').textContent = scene.title || sid;

      const sp = scene.splat || {};
      const url = sp.url || sp.splat_url;
      if (!url) return fail('Diese Szene hat kein Splat-Modell (splat.url fehlt).');
      if (sp.note) { const n = document.getElementById('note');
        n.textContent = sp.note; n.hidden = false; }

      // ---- Geometrie: Up-Achse, Zentrum, Boden-Augenhoehe --------------------
      const upv = new THREE.Vector3(...(sp.camera_up || [0, -1, 0])).normalize();
      const bb = sp.bbox || (scene.pointcloud || {});
      const mn = new THREE.Vector3(...(bb.bbox_min || [-5, -5, -5]));
      const mx = new THREE.Vector3(...(bb.bbox_max || [5, 5, 5]));
      // Blickziel: dichter Kern (focus, Median) falls vorhanden, sonst bbox-Mitte
      const center = sp.focus ? new THREE.Vector3(...sp.focus)
                              : mn.clone().add(mx).multiplyScalar(0.5);
      const radius = mn.distanceTo(mx) / 2 || 8;
      // horizontale Basis (senkrecht zur Up-Achse)
      const ref = Math.abs(upv.z) < 0.9 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0);
      const t1 = new THREE.Vector3().crossVectors(ref, upv).normalize();
      const t2 = new THREE.Vector3().crossVectors(upv, t1).normalize();

      // Startpose: 1,7 m UEBER dem Kern (focus), ein Stueck zurueck, Blick auf den Kern.
      // Alles relativ zum Fokuspunkt -- unabhaengig von fernen Ausreisser-Gaussians.
      const backDist = Math.min(radius * 1.5, 4.0);
      // Startpose: explizit aus scene.json (start/look) falls vorhanden -- noetig
      // fuer Szenen mit beliebiger Skala (die feste 1,7-m-Hoehe gilt nur metrisch).
      // Sonst Standard: etwas ueber dem Kern, ein Stueck zurueck, Blick auf den Kern.
      const eye = sp.start ? new THREE.Vector3(...sp.start)
        : center.clone()
            .add(upv.clone().multiplyScalar(1.7))
            .add(t1.clone().multiplyScalar(backDist));
      const lookT = sp.look ? new THREE.Vector3(...sp.look) : center.clone();
      const ld0 = lookT.clone().sub(eye).normalize();
      const yaw0 = Math.atan2(ld0.dot(t2), ld0.dot(t1));
      const pitch0 = Math.asin(Math.max(-1, Math.min(1, ld0.dot(upv))));

      // Echtes Headset-VR (WebXR) NUR aktivieren, wenn das Geraet immersive-vr
      // wirklich kann (Quest o.ae.). Sonst schaltet der Viewer renderer.xr.enabled
      // ein und der Desktop-Render-Loop bleibt schwarz (Daten laden zwar, aber es
      // wird nichts gezeichnet) -- genau das hatte den begehbaren Splat auf dem
      // Desktop unsichtbar gemacht. Auf dem Desktop also den alten, normalen Pfad.
      let xrVR = (GaussianSplats3D.WebXRMode && GaussianSplats3D.WebXRMode.None) || 0;
      if (navigator.xr && GaussianSplats3D.WebXRMode) {
        try {
          if (await navigator.xr.isSessionSupported('immersive-vr'))
            xrVR = GaussianSplats3D.WebXRMode.VR;
        } catch (e) { /* kein XR -> Desktop */ }
      }
      // Immer die volle Web-Version laden (Qualitaet). Frueher wurde auf VR-faehigen
      // Geraeten eine leichtere Version geladen -- das verschlechterte aber auch die
      // Desktop-Ansicht, wenn der Browser faelschlich "VR-faehig" meldete.
      const modelUrl = url;
      const viewer = new GaussianSplats3D.Viewer({
        cameraUp: upv.toArray(),
        initialCameraPosition: eye.toArray(),
        initialCameraLookAt: lookT.toArray(),
        sharedMemoryForWorkers: false,   // ohne COOP/COEP -> laeuft auf GitHub Pages
        useBuiltInControls: false,       // eigene Begehung, damit sich der Raum nicht dreht
        webXRMode: xrVR,                 // Headset-VR aktivieren (Quest etc.)
      });
      try {
        await viewer.addSplatScene(modelUrl, { showLoadingUI: true });
        viewer.start();
        window._viewer = viewer;          // Debug-/Test-Zugriff (Frame erzwingen)
      } catch (e) {
        return fail('Splat-Modell konnte nicht geladen werden: ' + (e && e.message || e));
      }

      // ---- eigene Steuerung: Begehen (First-Person) / Umkreisen --------------
      const cam = viewer.camera;
      cam.up.copy(upv);
      const cv = viewer.renderer.domElement;   // frueh: updateMarkers braucht es
      let mode = 'walk';
      let yaw = yaw0, pitch = pitch0;   // Start: stehend, Blick schraeg auf den Stumpf
      const pos = eye.clone();
      const step = Math.max(0.05, radius * 0.012);      // Schrittweite an Szenengroesse
      let orbYaw = 0, orbPitch = 0.35, orbR = radius * 1.8;   // Umkreisen
      const keys = {};
      window._pos = pos; window._cam = cam;             // fuer Funktionstest
      const look = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3();

      // ---- Marker: 3D-verankerte Info-Punkte mit Bild/Video/Text-Popup -------
      const ICON = { johnson: '👤', dictionary: '📖', barber: '👤', boswell: '✒️',
                     hodge: '🐈', tech: '✨', portal: '↪' };
      const markersData = Array.isArray(scene.markers) ? scene.markers : [];
      const mLayer = document.getElementById('markers');
      const pop = document.getElementById('pop'), card = document.getElementById('card');
      const mEls = markersData.filter(m => Array.isArray(m.pos)).map(m => {
        const el = document.createElement('button');
        el.className = 'pin';
        el.innerHTML = (ICON[m.id] || ICON[m.type] || '📍')
          + '<span class="lbl"></span>';
        el.querySelector('.lbl').textContent = m.title || '';
        el.addEventListener('click', ev => { ev.stopPropagation(); openCard(m); });
        mLayer.appendChild(el);
        return { el, w: new THREE.Vector3(...m.pos) };
      });
      const camDir = new THREE.Vector3(), rel = new THREE.Vector3(), ndc = new THREE.Vector3();
      function updateMarkers() {
        try {
          const w = cv.clientWidth, h = cv.clientHeight;
          cam.getWorldDirection(camDir);
          for (const o of mEls) {
            rel.copy(o.w).sub(cam.position);
            if (rel.dot(camDir) <= 0.001) { o.el.style.display = 'none'; continue; }
            ndc.copy(o.w).project(cam);
            if (ndc.x < -1.3 || ndc.x > 1.3 || ndc.y < -1.3 || ndc.y > 1.3) {
              o.el.style.display = 'none'; continue; }
            o.el.style.display = '';
            o.el.style.left = ((ndc.x * 0.5 + 0.5) * w) + 'px';
            o.el.style.top = ((-ndc.y * 0.5 + 0.5) * h) + 'px';
          }
        } catch (e) { window._merr = (e && e.message) || String(e); }
      }
      function openCard(m) {
        const media = m.video ? '<video controls playsinline src="' + m.video + '"></video>'
          : m.image ? '<img src="' + m.image + '" alt="" />' : '';
        card.innerHTML = media
          + '<div class="body"><button class="x" aria-label="Schließen">×</button>'
          + '<h2>' + (m.title || '') + '</h2>'
          + '<p>' + (m.text || '') + '</p>'
          + (m.caption ? '<div class="cap">' + m.caption + '</div>' : '')
          + (m.credit ? '<div class="cred">' + m.credit + '</div>' : '')
          + '</div>';
        card.querySelector('.x').onclick = closeCard;
        pop.classList.add('open');
      }
      function closeCard() { pop.classList.remove('open');
        const v = card.querySelector('video'); if (v) v.pause(); }
      pop.addEventListener('click', e => { if (e.target === pop) closeCard(); });
      addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

      // ---- WebXR: Enter-VR-Button + Controller-Fortbewegung ------------------
      // Isoliert: alles Folgende wirkt NUR waehrend einer laufenden VR-Sitzung,
      // der Desktop-Pfad bleibt unveraendert.
      let xrBase = null;                       // Basis-Referenzraum bei Sitzungsstart
      const xrPlayer = eye.clone();            // Spielerstandpunkt (Modellraum)
      let xrTurn = 0, xrTurned = false;        // Snap-Turn-Zustand
      const _qUp = new THREE.Quaternion()      // Modell-Up -> Y-Up (Boden waagerecht)
        .setFromUnitVectors(upv, new THREE.Vector3(0, 1, 0));
      if (xrVR) {
        const btn = VRButton.createButton(viewer.renderer);
        btn.style.zIndex = 45;
        document.body.appendChild(btn);
        viewer.renderer.xr.addEventListener('sessionstart', () => {
          xrBase = viewer.renderer.xr.getReferenceSpace();
          xrPlayer.copy(eye); xrTurn = 0;
        });
        viewer.renderer.xr.addEventListener('sessionend', () => { xrBase = null; });
      }
      function xrLocomotion() {
        const xr = viewer.renderer.xr;
        if (!xr.isPresenting || !xrBase) return;
        const session = xr.getSession(); if (!session) return;
        let mx = 0, my = 0, turn = 0;
        for (const src of session.inputSources) {
          const gp = src.gamepad; if (!gp || !gp.axes) continue;
          const ax = gp.axes;
          const sx = ax.length > 2 ? ax[2] : ax[0];   // xr-standard: Stick auf [2],[3]
          const sy = ax.length > 3 ? ax[3] : ax[1];
          if (src.handedness === 'right') turn += sx || 0;   // rechts = drehen
          else { mx += sx || 0; my += sy || 0; }             // links/unbekannt = gehen
        }
        if (Math.abs(turn) > 0.7 && !xrTurned) {             // Snap-Turn 30 Grad
          xrTurn += -Math.sign(turn) * Math.PI / 6; xrTurned = true;
        }
        if (Math.abs(turn) < 0.3) xrTurned = false;
        const qTot = _qUp.clone()
          .multiply(new THREE.Quaternion().setFromAxisAngle(upv, xrTurn));
        if (Math.abs(mx) > 0.15 || Math.abs(my) > 0.15) {
          const xc = xr.getCamera();
          const hf = new THREE.Vector3(); xc.getWorldDirection(hf);
          hf.applyQuaternion(qTot.clone().invert());         // Kopfrichtung -> Modellraum
          hf.addScaledVector(upv, -hf.dot(upv));             // auf Bodenebene projizieren
          if (hf.lengthSq() < 1e-6) hf.copy(t1);
          hf.normalize();
          const hr = new THREE.Vector3().crossVectors(hf, upv).normalize();
          const spd = Math.max(0.01, radius * 0.02);
          xrPlayer.addScaledVector(hf, -my * spd).addScaledVector(hr, mx * spd);
        }
        const off = xrPlayer.clone().applyQuaternion(qTot).multiplyScalar(-1);
        const xform = new XRRigidTransform(
          { x: off.x, y: off.y, z: off.z },
          { x: qTot.x, y: qTot.y, z: qTot.z, w: qTot.w });
        xr.setReferenceSpace(xrBase.getOffsetReferenceSpace(xform));
      }

      function lookVec(y, p) {
        const cp = Math.cos(p);
        return t1.clone().multiplyScalar(cp * Math.cos(y))
          .add(t2.clone().multiplyScalar(cp * Math.sin(y)))
          .add(upv.clone().multiplyScalar(Math.sin(p)));
      }
      function frame() {
        // Im Headset (WebXR) steuert die Brille die Kamera; Fortbewegung per Controller.
        if (viewer.renderer && viewer.renderer.xr && viewer.renderer.xr.isPresenting) {
          xrLocomotion();
          requestAnimationFrame(frame); return;
        }
        if (mode === 'walk') {
          // horizontale Bewegungsrichtung (auf dem "Boden")
          fwd.copy(t1).multiplyScalar(Math.cos(yaw)).add(t2.clone().multiplyScalar(Math.sin(yaw)));
          right.crossVectors(fwd, upv).normalize();
          const sp0 = step * (keys['shift'] ? 3 : 1);
          if (keys['w']) pos.addScaledVector(fwd, sp0);
          if (keys['s']) pos.addScaledVector(fwd, -sp0);
          if (keys['d']) pos.addScaledVector(right, sp0);
          if (keys['a']) pos.addScaledVector(right, -sp0);
          if (keys['e']) pos.addScaledVector(upv, sp0);
          if (keys['q']) pos.addScaledVector(upv, -sp0);
          cam.position.copy(pos);
          cam.up.copy(upv);
          cam.lookAt(look.copy(pos).add(lookVec(yaw, pitch)));
        } else {
          const d = lookVec(orbYaw, orbPitch);
          cam.up.copy(upv);
          cam.position.copy(center.clone().addScaledVector(d, orbR));
          cam.lookAt(center);
        }
        updateMarkers();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Maus-Umschauen (ziehen)
      let drag = false, px = 0, py = 0;
      cv.style.cursor = 'grab';
      cv.addEventListener('pointerdown', e => { drag = true; px = e.clientX; py = e.clientY;
        cv.style.cursor = 'grabbing'; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointerup', e => { drag = false; cv.style.cursor = 'grab'; });
      cv.addEventListener('pointermove', e => {
        if (!drag) return;
        const dx = (e.clientX - px) * 0.005, dy = (e.clientY - py) * 0.005;
        px = e.clientX; py = e.clientY;
        const clamp = v => Math.max(-1.5, Math.min(1.5, v));
        if (mode === 'walk') { yaw -= dx; pitch = clamp(pitch - dy); }
        else { orbYaw -= dx; orbPitch = clamp(orbPitch + dy); }
      });
      cv.addEventListener('wheel', e => { e.preventDefault();
        if (mode === 'orbit') orbR = Math.max(radius * 0.2, orbR * (1 + Math.sign(e.deltaY) * 0.1));
        else pos.addScaledVector(lookVec(yaw, pitch), -Math.sign(e.deltaY) * 1.5);
      }, { passive: false });
      addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true;
        keys['shift'] = e.shiftKey; });
      addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false;
        keys['shift'] = e.shiftKey; });

      // Modus-Umschalter
      const bw = document.getElementById('m-walk'), bo = document.getElementById('m-orbit');
      const setMode = m => { mode = m; bw.classList.toggle('active', m === 'walk');
        bo.classList.toggle('active', m === 'orbit');
        document.getElementById('help').style.display = m === 'walk' ? 'block' : 'none'; };
      bw.onclick = () => setMode('walk');
      bo.onclick = () => setMode('orbit');
    }
    init().catch(e => fail('Fehler: ' + (e && e.message || e)));
  </script>
</body>
</html>
