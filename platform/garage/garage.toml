# Garage-Konfiguration fuer Single-Node-Selfhosting.
#
# KEIN rpc_secret in dieser Datei: sie ist versioniert. Frueher schrieb
# init/bootstrap.sh das generierte Secret hier hinein -- damit landete es beim
# naechsten Commit im Repository. Garage liest es stattdessen aus der
# Umgebungsvariablen GARAGE_RPC_SECRET, die aus der (nicht versionierten)
# platform/.env kommt.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
