[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioscale"
version = "0.1.0"
description = "Punktbezogene Biodiversitaetsdaten mit offener Fernerkundung auf die Flaeche bringen - mit Wirkradius, Gueltigkeitsbereich (AOA) und raeumlicher Pruefung."
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.5",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
gbm = ["lightgbm>=4.0"]
maxent = ["elapid>=1.0"]
stac = ["pystac-client>=0.7"]
als = ["laspy>=2.5", "lazrs>=0.5"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=7", "httpx>=0.25"]
all = ["lightgbm>=4.0", "elapid>=1.0", "pystac-client>=0.7", "laspy>=2.5", "lazrs>=0.5",
       "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
bioscale = "bioscale.cli:main"
bioscale-app = "bioscale.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioscale = ["profiles/*.yml", "web/*.html", "report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: braucht Internet (wird ohne BIOSCALE_NETWORK=1 uebersprungen)"]
