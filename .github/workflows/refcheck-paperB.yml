name: refcheck-paperB

# Prueft die Literatur von Paper B gegen Crossref und holt die Zenodo-Beschreibung des
# Pellis-Datensatzes (aus der Cloud-Sitzung gesperrt). Ausloeser: .github/refcheck-paperB-request.txt
on:
  push:
    paths: [".github/refcheck-paperB-request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/ci_refcheck_paperB.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add Paper_ODT/Heritage_Toolkit_Paper/lit/refs_check.md && git commit -m "Paper B: Literaturpruefung (Crossref)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
