name: foredgeclim

# Q-ForestLab-Projekt (scripts/QFOREST_PROJEKT.md), Schritt 5a: ForEdgeClim v1.0.1
# (Van de Walle, Q-ForestLab; Zenodo 19630260, MIT) aus dem Zenodo-Archiv bauen und
# das mitgelieferte Testskript (Gontrode, 08.07.2023) laufen lassen. Ziel: belegen,
# dass das Modell laeuft, und die Struktur der Eingabe-Gitter (.rds) dokumentieren,
# damit eigene TLS-Gitter (Q-ForestLab-Plots, virtuelle Stoerung) eingespeist werden
# koennen. Ergebnisse -> extdata/qforest/foredgeclim_test/.
on:
  push:
    paths: [".github/foredgeclim-request.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foredgeclim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::suncalc
            any::lidR
            any::data.table
            any::ggtext
            any::Rcpp
            any::RcppArmadillo
            any::readxl
          dependencies: '"hard"'
      - name: ForEdgeClim aus Zenodo holen und bauen
        run: |
          curl -sSL -o fec.zip "https://zenodo.org/records/19630260/files/EmmaVdW27/ForEdgeClim-v1.0.1.zip?download=1"
          unzip -q fec.zip && mv EmmaVdW27-ForEdgeClim-* fec
          rm -f fec/src/*.o fec/src/*.dll
          # Linux-Build: Linkerflags wie unter Windows (LAPACK/BLAS fuer Armadillo)
          [ -f fec/src/Makevars ] || cp fec/src/Makevars.win fec/src/Makevars
          cat fec/src/Makevars
          R CMD INSTALL fec
      - name: Eingabe-Gitter dokumentieren
        working-directory: fec
        run: |
          mkdir -p ../out
          Rscript -e 'g <- readRDS("Data/TLS_scaled_DTM_and_grid_July2023.rds"); sink("../out/grid_struktur.txt"); str(g, max.level = 2, list.len = 40); sink()'
          cat ../out/grid_struktur.txt | head -80
      - name: Testskript (Gontrode, 08.07.2023)
        working-directory: fec
        run: |
          timeout 150m Rscript Scripts/testing_foredgeclim.R 2>&1 | tee ../out/testlauf.log | tail -80
          cp -r Output ../out/Output_run 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: foredgeclim, path: out, retention-days: 7, if-no-files-found: ignore }
      - name: Ergebnisse sichern
        if: always()
        run: |
          D=extdata/qforest/foredgeclim_test
          mkdir -p $D
          cp out/grid_struktur.txt $D/ 2>/dev/null || true
          tail -300 out/testlauf.log > $D/testlauf_ende.log 2>/dev/null || true
          find out/Output_run -name "*.png" -size -400k -exec cp {} $D/ \; 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add $D
          git commit -m "ForEdgeClim: Testlauf (Gontrode) und Gitterstruktur" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
