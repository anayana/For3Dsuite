name: litsearch

# Prueft Literatur ueber OpenAlex (aus der Cloud-Umgebung gesperrt) und committet
# Paper_ODT/Forst_Benchmark_Paper/lit/litsearch.md. Ausloeser: .github/litsearch-request.txt
on:
  push:
    paths: [".github/litsearch-request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/ci_litsearch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add Paper_ODT/Forst_Benchmark_Paper/lit/litsearch.md && git commit -m "Literaturpruefung (litsearch)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
