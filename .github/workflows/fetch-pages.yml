name: fetch-pages

# Holt oeffentliche Webseiten (z. B. Autorenrichtlinien von Zeitschriften), die aus
# der Cloud-Umgebung gesperrt sind, und legt sie als reinen Text unter
# Paper_ODT/Forst_Benchmark_Paper/lit/pages/ ab. Eine URL je Zeile in
# .github/pages-request.txt (Zeilen mit # werden ignoriert).
on:
  push:
    paths: [".github/pages-request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4
      - run: |
          D=Paper_ODT/Forst_Benchmark_Paper/lit/pages; mkdir -p $D raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          grep -v '^#' .github/pages-request.txt | grep -E '^https?://' | while read -r u; do
            n=$(echo "$u" | sed -E 's#https?://##; s#[^A-Za-z0-9]+#_#g' | cut -c1-80)
            curl -sL -A "$UA" -H "Accept-Language: en" "$u" -o raw/$n.html || true
            python3 - raw/$n.html $D/$n.txt "$u" <<'PY'
          import sys
          from bs4 import BeautifulSoup
          src, dst, url = sys.argv[1:]
          s = BeautifulSoup(open(src, errors="ignore").read(), "html.parser")
          for t in s(["script", "style", "nav", "footer", "header"]):
              t.decompose()
          txt = "\n".join(l.strip() for l in s.get_text("\n").splitlines() if l.strip())
          open(dst, "w").write(f"Quelle: {url}\n\n{txt}\n")
          print(url, len(txt), "Zeichen")
          PY
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add $D && git commit -m "Webseiten als Text (fetch-pages)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
