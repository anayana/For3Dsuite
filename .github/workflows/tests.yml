name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        # Bewusst schlank: die Kern-Tests brauchen nur numpy + pytest, keine
        # Schwergewichte (laspy/pye57/torch) und keine GPU.
        run: pip install numpy pytest
      - name: Run tests
        run: pytest tests/ -q
