name: zenodo-paperB

# Laedt das schlanke Archiv fuer Paper B (scripts/paperB_zenodo_zip.py) auf Zenodo hoch,
# setzt die Metadaten, veroeffentlicht und schreibt die DOI nach
# Paper_ODT/Heritage_Toolkit_Paper/zenodo/doi.txt. Braucht das Repo-Secret ZENODO_TOKEN
# (Zenodo -> Applications -> Personal access token, Rechte deposit:write + deposit:actions).
# Ausloeser: Aenderung an .github/zenodo-paperB-request.txt (oder manuell).
on:
  push:
    paths: [".github/zenodo-paperB-request.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenodo-paperB
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/paperB_zenodo_zip.py out/paperB_code_results.zip
      - name: Hochladen und veroeffentlichen
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, requests
          tok = os.environ.get("ZENODO_TOKEN")
          if not tok:
              sys.exit("Secret ZENODO_TOKEN fehlt")
          api = "https://zenodo.org/api/deposit/depositions"
          h = {"Authorization": f"Bearer {tok}"}
          # neue VERSION des ersten Eintrags (gleiche Konzept-DOI), kein weiterer Einzeleintrag
          BASE_ID = 23926783
          r = requests.post(f"{api}/{BASE_ID}/actions/newversion", headers=h, timeout=60)
          print("newversion", r.status_code, r.text[:300]); r.raise_for_status()
          r = requests.get(r.json()["links"]["latest_draft"], headers=h, timeout=60); r.raise_for_status()
          dep = r.json(); did = dep["id"]; bucket = dep["links"]["bucket"]
          for f in dep.get("files", []):                       # alte Datei aus dem Entwurf entfernen
              requests.delete(f"{api}/{did}/files/{f['id']}", headers=h, timeout=60).raise_for_status()
          try:
              with open("out/paperB_code_results.zip", "rb") as f:
                  r = requests.put(f"{bucket}/paperB_code_results.zip", data=f, headers=h, timeout=600)
              print("upload", r.status_code); r.raise_for_status()
              meta = {"metadata": {
                  "upload_type": "software",
                  "title": "Code and results for: How close is a Gaussian splat to the survey? Geometric accuracy "
                           "of 3D Gaussian Splatting against photogrammetric reference point clouds of historic buildings",
                  "creators": [{"name": "Naya, Angel", "affiliation": "Independent Researcher, Berlin, Germany"}],
                  "description": "Scripts (conversion of the published Pellis et al. 2025 camera parameters to COLMAP, "
                                 "gsplat 1.5.3 training on a rented GPU, geometric comparison of splat centres with the "
                                 "labelled photogrammetric reference cloud per architectural class, diagnostics, figures), "
                                 "unit tests and all result tables of the study. Third-party data are not included; see README.",
                  "license": "gpl-3.0-or-later",
                  "version": "2.0 (full image resolution)",
                  "publication_date": __import__("datetime").date.today().isoformat(),
                  "access_right": "open",
                  "keywords": ["3D Gaussian Splatting", "cultural heritage", "photogrammetry", "point cloud comparison", "accuracy assessment", "gsplat"],
              }}
              r = requests.put(f"{api}/{did}", json=meta, headers=h, timeout=60)
              print("metadata", r.status_code, r.text[:500]); r.raise_for_status()
              r = requests.post(f"{api}/{did}/actions/publish", headers=h, timeout=120)
              print("publish", r.status_code, r.text[:300]); r.raise_for_status()
          except Exception:
              requests.delete(f"{api}/{did}", headers=h, timeout=60)   # Entwurf nicht liegen lassen
              raise
          pub = r.json(); doi = pub.get("doi") or pub["metadata"]["doi"]
          cdoi = pub.get("conceptdoi", "")
          print("DOI", doi, "Konzept-DOI", cdoi, pub["links"].get("html"))
          os.makedirs("Paper_ODT/Heritage_Toolkit_Paper/zenodo", exist_ok=True)
          open("Paper_ODT/Heritage_Toolkit_Paper/zenodo/doi.txt", "w").write(f"{doi}\n{pub['links'].get('html', '')}\nconcept: {cdoi}\n")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add Paper_ODT/Heritage_Toolkit_Paper/zenodo/doi.txt && git commit -m "Paper B: Zenodo-DOI" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
