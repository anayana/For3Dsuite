name: deploy-hf-space

# Bringt das Studio als oeffentliche Demo auf einen Hugging Face Space.
# Einmalig einrichten (siehe deploy/hf-space/ANLEITUNG.md):
#   - Space anlegen (SDK: Docker)
#   - Repository-Secret HF_TOKEN (HF-Token mit Schreibrecht)
#   - optional Repository-Variable HF_SPACE (Standard: anayananaya/for3dsuite)
# Ohne HF_TOKEN laeuft der Workflow durch, ohne etwas zu tun.
on:
  push:
    branches: [main]
    paths:
      - "platform/app/**"
      - "platform/web/**"
      - "scripts/e57_extract_images.py"
      - "scripts/reproject_pano.py"
      - "scripts/markers_from_xyz.py"
      - "scripts/pointcloud_web.py"
      - "scripts/inventory_from_cloud.py"
      - "scripts/pano_variants.py"
      - "deploy/hf-space/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'anayananaya/for3dsuite' }}
    steps:
      - uses: actions/checkout@v4
      - name: Kein HF_TOKEN gesetzt
        if: env.HF_TOKEN == ''
        run: echo "Repository-Secret HF_TOKEN fehlt -- nichts zu tun."
      - name: Space zusammenstellen und hochladen
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          D="$(mktemp -d)"
          mkdir -p "$D/platform" "$D/scripts"
          cp -r platform/app platform/web "$D/platform/"
          find "$D" -name __pycache__ -prune -exec rm -rf {} +
          for s in e57_extract_images reproject_pano markers_from_xyz pointcloud_web \
                   inventory_from_cloud pano_variants; do
            cp "scripts/$s.py" "$D/scripts/"
          done
          cp deploy/hf-space/Dockerfile deploy/hf-space/README.md "$D/"
          cd "$D"
          git init -q -b main
          git add -A
          git -c user.name="For3Dsuite deploy" -c user.email="deploy@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7} aus anayana/For3Dsuite"
          git push -f "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Space: https://huggingface.co/spaces/${HF_SPACE}"
