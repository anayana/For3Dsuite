name: fetch-splats

# Holt die Pellis-Szenen (schlanke .ply, scene.json, thumb.jpg) von einem laufenden RunPod-Pod
# (Port 8000, /workspace/web) ins Repo: docs/media/scenes/pellis-*/, docs/data/scene-pellis-*.json,
# Eintraege in docs/data/scenes.json. Ausloeser: .github/splats-request.txt
# (erste nicht kommentierte Zeile = Basis-URL, z. B. https://<podid>-8000.proxy.runpod.net).
on:
  push:
    paths: [".github/splats-request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - run: |
          BASE=$(grep -v '^#' .github/splats-request.txt | grep -E '^https?://' | head -1 | sed 's#/*$##')
          echo "Basis: $BASE"
          for b in pellis-5-cb pellis-3-ss pellis-2-osa; do
            n=${b#pellis-}; n=${n//-/_}
            T=/tmp/dl/$b; mkdir -p $T
            # erst alles in einen Zwischenordner; vorhandene Szenen nur bei vollstaendigem Download ersetzen
            curl -sfL "$BASE/$b/$n.ply" -o $T/$n.ply && curl -sfL "$BASE/$b/thumb.jpg" -o $T/thumb.jpg \
              && curl -sfL "$BASE/$b/scene.json" -o $T/scene.json && curl -sfL "$BASE/$b/entry.json" -o $T/entry.json \
              || { echo "nicht erreichbar: $b (vorhandene Szene bleibt)"; continue; }
            D=docs/media/scenes/$b; mkdir -p $D/views
            for k in 0 1 2 3 4 5 6 7; do curl -sfL "$BASE/$b/views/view_$k.jpg" -o $D/views/view_$k.jpg || rm -f $D/views/view_$k.jpg; done
            mv $T/$n.ply $T/thumb.jpg $D/; mv $T/scene.json docs/data/scene-$b.json; mv $T/entry.json /tmp/entry-$b.json
            ls -la $D
          done
          python3 - <<'PY'
          import glob, json
          p = "docs/data/scenes.json"
          scenes = json.load(open(p))
          for f in sorted(glob.glob("/tmp/entry-*.json")):
              e = json.load(open(f))
              scenes = [s for s in scenes if s["id"] != e["id"]] + [e]
              print("Eintrag", e["id"])
          json.dump(scenes, open(p, "w"), ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs && git commit -m "Pellis-Szenen fuer die Suite (fetch-splats)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
